<!DOCTYPE html>
<html lang="en" class="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CodeCollab Room</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/rooms.css">

<style>
  :root{
    /* Dark Theme Palette */
    --bg:#090d16; 
    --surface:#111726; 
    --surface-2:#1a2336; 
    --surface-3:#243047;
    --border:#212c40; 
    --border-soft:#2a3852;
    --text:#f1f5f9; 
    --text-muted:#94a3b8; 
    --text-faint:#64748b;

    /* Accent & Status Colors */
    --accent:#3b82f6; 
    --accent-dim:#2563eb; 
    --accent-soft:rgba(59,130,246,.15);
    --pulse:#a855f7; 
    --pulse-dim:#9333ea; 
    --pulse-soft:rgba(168,85,247,.15);
    --share:#14b8a6; 
    --share-dim:#0d9488; 
    --share-soft:rgba(20,184,166,.15);
    --amber:#f59e0b; 
    --amber-soft:rgba(245,158,11,.15);
    --danger:#ef4444; 
    --danger-soft:rgba(239,68,68,.15);
    --success:#22c55e; 
    --success-soft:rgba(34,197,94,.15);

    --font-display:'Sora',sans-serif; 
    --font-body:'Manrope',sans-serif; 
    --font-mono:'JetBrains Mono',monospace;
  }
  
  *{ box-sizing:border-box; }
  html,body{ background:var(--bg); color:var(--text); font-family:var(--font-body); color-scheme: dark; }
  .font-display{ font-family:var(--font-display); }
  .font-mono{ font-family:var(--font-mono); }
  ::selection{ background:var(--accent-soft); color:var(--accent); }
  
  .icon{ width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block; flex-shrink:0; }
  .icon-solid{ width:13px; height:13px; fill:currentColor; stroke:none; display:block; flex-shrink:0; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:99px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--border-soft); }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  /* ===== Resize handles ===== */
  .resize-x{
    width:5px; flex-shrink:0; cursor:col-resize; position:relative; z-index:30;
    background:transparent; transition:background .15s ease;
  }
  .resize-x:hover, .resize-x.is-active{ background:var(--accent-soft); }
  .resize-x::after{
    content:''; position:absolute; top:0; bottom:0; left:50%; width:1px;
    background:var(--border); transform:translateX(-50%); transition:background .15s ease;
  }
  .resize-x:hover::after, .resize-x.is-active::after{ background:var(--accent); }
  
  .resize-y{
    height:5px; flex-shrink:0; cursor:row-resize; position:relative; z-index:30;
    background:transparent; transition:background .15s ease;
  }
  .resize-y:hover, .resize-y.is-active{ background:var(--accent-soft); }
  .resize-y::after{
    content:''; position:absolute; left:0; right:0; top:50%; height:1px;
    background:var(--border); transform:translateY(-50%); transition:background .15s ease;
  }
  .resize-y:hover::after, .resize-y.is-active::after{ background:var(--accent); }
  
  body.resizing-x, body.resizing-x *{ cursor:col-resize !important; user-select:none !important; }
  body.resizing-y, body.resizing-y *{ cursor:row-resize !important; user-select:none !important; }

  /* ===== Sidebar (Explorer) ===== */
  aside.explorer{
    background:var(--surface); border-color:var(--border) !important; width:250px; flex-shrink:0; min-width:0;
    animation:fadeUp .5s ease both;
  }
  .panel-head{
    font-family:var(--font-display); font-weight:700; font-size:.82rem;
    letter-spacing:.02em; color:var(--text);
    display:flex; align-items:center; gap:.5rem;
  }
  .panel-head .icon{ color:var(--accent); width:15px; height:15px; }
  #fileExplorer{ font-family:var(--font-mono); font-size:.84rem; color:var(--text-muted); }
  #fileExplorer:empty::before{
    content:'No files yet'; color:var(--text-faint); display:block; padding:1rem;
    font-family:var(--font-body); font-size:.8rem; text-align:center;
  }

  #newFileBtn{
    background:var(--surface-2); color:var(--text-muted);
    border:1px solid var(--border);
    font-family:var(--font-body); font-weight:600; font-size:.83rem;
    display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
    transition:all .15s ease;
  }
  #newFileBtn:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  #newFileBtn:active{ transform:scale(.98); }

  /* ===== Top toolbar ===== */
  .toolbar{
    background:rgba(17, 23, 38, 0.85); backdrop-filter:blur(12px);
    border-color:var(--border) !important;
  }
  #roomTitle{ font-family:var(--font-display); font-weight:700; letter-spacing:-.01em; color:var(--text); }
  #roomTitle:empty::before{ content:'Untitled Room'; color:var(--text-faint); }

  .tool-btn{
    font-family:var(--font-body); font-weight:600; font-size:.81rem;
    border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted);
    transition:all .15s ease;
    display:inline-flex; align-items:center; gap:.4rem;
  }
  .tool-btn:hover{ color:var(--text); border-color:var(--border-soft); background:var(--surface-3); }
  .tool-btn:active{ transform:scale(.97); }

  #cameraBtn:hover, #cameraBtn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  #micBtn:hover, #micBtn.active{ background:var(--amber-soft); color:var(--amber); border-color:var(--amber); }
  #shareScreenBtn:hover, #shareScreenBtn.active{ background:var(--share-soft); color:var(--share); border-color:var(--share); }

  #saveBtn{ background:var(--success-soft); color:var(--success); border-color:var(--success); font-weight:700; }
  #saveBtn:hover{ background:var(--success); color:#ffffff; box-shadow:0 8px 20px -10px rgba(34,197,94,.4); }

  #copyRoomCode{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  #copyRoomCode:hover{ background:var(--accent); color:#ffffff; }

  #exitBtn{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }
  #exitBtn:hover{ background:var(--danger); color:#ffffff; }

  /* ===== Video / screenshare ===== */
  #meetingArea{ background:var(--surface); border-color:var(--border) !important; animation:fadeUp .35s ease both; }
  #localVideo, #screenVideo{
    background:#070a12;
    border:1px solid var(--border);
    border-radius:8px;
  }
  #meetingArea .flex > div span{ color:var(--text-muted); font-family:var(--font-mono); font-size:.72rem; }
  #screenShareContainer{ border-color:var(--border) !important; animation:fadeUp .35s ease both; }

  /* ===== Editor / Terminal split ===== */
  #editorTerminalSplit{ min-height:0; }
  #editorPane{ min-height:80px; position:relative; }
  #editorPane::after{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
    box-shadow:inset 0 0 0 1px var(--border);
  }
  #editor{ background:#0b0f19; }

  .terminal-wrap{ background:#060911; border-color:var(--border) !important; height:224px; flex-shrink:0; min-height:100px; display:flex; flex-direction:column; }
  .terminal-head{ background:var(--surface-2); border-bottom:1px solid var(--border); flex-shrink:0; }
  .terminal-head .dot{ width:8px; height:8px; border-radius:999px; display:inline-block; }
  
  #runBtn{
    background:var(--accent); color:#ffffff;
    font-family:var(--font-display); font-weight:700; font-size:.78rem;
    display:inline-flex; align-items:center; gap:.4rem;
    transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  #runBtn:hover{ background:var(--accent-dim); box-shadow:0 6px 16px -8px rgba(59,130,246,.5); }
  #runBtn:active{ transform:scale(.96); }
  
  #terminalOutput{
    font-family:var(--font-mono); font-size:.82rem; line-height:1.6;
    color:var(--share);
  }
  #terminalOutput:not(:empty){ animation:fadeIn .25s ease; }

  /* ===== Right sidebar ===== */
  aside.sidebar-right{
    background:var(--surface); border-color:var(--border) !important; width:320px; flex-shrink:0; min-width:0;
    animation:fadeUp .5s ease .05s both;
  }

  #onlineUsers{ font-family:var(--font-body); font-size:.85rem; color:var(--text-muted); }
  #onlineUsers:empty::before{
    content:'No one else is here yet'; color:var(--text-faint); font-size:.8rem;
  }

  /* Chat / AI tabs */
  #chatTab, #aiTab{
    font-family:var(--font-display); font-weight:600; font-size:.83rem;
    color:var(--text-muted);
    border-bottom:2px solid transparent;
    display:flex; align-items:center; justify-content:center; gap:.45rem;
    transition:all .15s ease;
    background:transparent !important;
  }
  #chatTab.bg-slate-700{ color:var(--accent); border-bottom-color:var(--accent); }
  #aiTab.bg-slate-700{ color:var(--pulse); border-bottom-color:var(--pulse); }
  #chatTab:hover, #aiTab:hover{ background:var(--surface-2) !important; color:var(--text); }

  #chatMessages{ font-size:.87rem; }
  #chatMessages:empty::before{
    content:'Say hi to get things started'; color:var(--text-faint); font-size:.8rem;
  }

  #chatInput{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #chatInput::placeholder{ color:var(--text-faint); }
  #chatInput:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  #sendBtn{
    background:var(--accent); color:#ffffff;
    font-family:var(--font-display); font-weight:700;
    display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
    transition:background .15s ease, transform .15s ease;
  }
  #sendBtn:hover{ background:var(--accent-dim); }
  #sendBtn:active{ transform:scale(.97); }

  /* AI panel */
  #aiPanel:not(.hidden){ animation:fadeIn .25s ease; }
  
  #aiControlBlock {
    min-height: 120px;
    height: 280px;
    flex-shrink: 0;
  }

  #explainBtn, #autocompleteBtn{
    background:var(--surface-2); color:var(--text); border:1px solid var(--border); font-weight:600; font-size:.85rem;
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    transition:all .15s ease;
  }
  #explainBtn:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  #autocompleteBtn:hover{ border-color:var(--success); color:var(--success); background:var(--success-soft); }

  #generatePrompt{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    font-family:var(--font-mono); font-size:.85rem;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #generatePrompt::placeholder{ color:var(--text-faint); font-family:var(--font-body); }
  #generatePrompt:focus{ outline:none; border-color:var(--pulse); box-shadow:0 0 0 3px var(--pulse-soft); }

  #generateBtn{
    background:var(--pulse); color:#ffffff;
    font-family:var(--font-display); font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  #generateBtn:hover{ background:var(--pulse-dim); box-shadow:0 8px 20px -10px rgba(168,85,247,.4); }
  #generateBtn:active{ transform:scale(.97); }

  #aiResponse{ 
    font-family:var(--font-mono); 
    font-size:.82rem; 
    line-height:1.6; 
    color:var(--text-muted); 
    background:var(--bg); 
  }

  /* AI Card Containers & Resizers */
  .ai-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    min-height: 80px;
    height: auto;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .ai-card h3 {
    color: var(--text);
    font-family: var(--font-display);
    font-weight: 600;
    margin-bottom: 0.5rem;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .ai-card-content {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  .ai-card-resizer {
    height: 8px;
    margin: 4px 0;
    cursor: row-resize;
    position: relative;
    flex-shrink: 0;
    z-index: 10;
  }
  .ai-card-resizer::after {
    content: '';
    position: absolute;
    left: 20%;
    right: 20%;
    top: 50%;
    height: 2px;
    background: var(--border-soft);
    border-radius: 99px;
    transform: translateY(-50%);
    transition: background 0.15s ease;
  }
  .ai-card-resizer:hover::after, .ai-card-resizer.is-active::after {
    background: var(--pulse);
  }

  /* ===== Modal ===== */
  #newFileModal{ animation:fadeIn .18s ease; backdrop-filter:blur(6px); }
  #newFileModal .modal-card{
    background:var(--surface); border:1px solid var(--border);
    animation:fadeUp .25s cubic-bezier(.22,.68,.36,1) both;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  }
  #newFileName{
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #newFileName:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #cancelFileBtn{ background:var(--surface-2); color:var(--text-muted); font-weight:600; border:1px solid var(--border); transition:all .15s ease; }
  #cancelFileBtn:hover{ color:var(--text); border-color:var(--border-soft); background:var(--surface-3); }
  #createFileBtn{ background:var(--accent); color:#ffffff; font-family:var(--font-display); font-weight:700; transition:background .15s ease, transform .15s ease; }
  #createFileBtn:hover{ background:var(--accent-dim); }
  #createFileBtn:active{ transform:scale(.97); }

  /* ===== Context menu ===== */
  #fileMenu{
    background:var(--surface); border-color:var(--border) !important;
    box-shadow:0 15px 35px -15px rgba(0,0,0,.5);
    animation:fadeIn .12s ease;
  }
  #renameFileBtn, #deleteFileBtn{
    font-size:.85rem; color:var(--text); transition:background .15s ease;
    display:flex; align-items:center; gap:.6rem;
  }
  #renameFileBtn:hover{ background:var(--surface-2) !important; }
  #deleteFileBtn:hover{ background:var(--danger-soft) !important; color:var(--danger); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>

</head>

<body class="h-screen overflow-hidden">

<div class="flex h-screen">

    <aside
        class="explorer border-r flex flex-col">

        <div class="p-4 border-b" style="border-color:var(--border);">

            <h2 class="panel-head">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                Explorer
            </h2>

        </div>

        <div
            id="fileExplorer"
            class="flex-1 overflow-y-auto">

        </div>

        <div
            class="p-3 border-t" style="border-color:var(--border);">

            <button
                id="newFileBtn"
                class="w-full rounded-lg p-2.5">

                <svg class="icon" style="width:15px;height:15px;" viewBox="0 0 24 24"><path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13 3v6h6"/><line x1="12" y1="13" x2="12" y2="18"/><line x1="9.5" y1="15.5" x2="14.5" y2="15.5"/></svg>
                New File

            </button>

        </div>

    </aside>

    <div id="resizeExplorer" class="resize-x" title="Drag to resize"></div>

    <main class="flex-1 flex flex-col min-w-0">

        <div
            class="toolbar h-14 border-b flex items-center justify-between px-4 flex-shrink-0">

            <h2
                id="roomTitle"
                class="text-lg">

            </h2>

            <div class="flex gap-2 flex-wrap">

                <button
                    id="cameraBtn"
                    class="tool-btn px-3 py-2 rounded-lg">

                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
                    Camera

                </button>

                <button
                    id="micBtn"
                    class="tool-btn px-3 py-2 rounded-lg">

                    <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
                    Mic

                </button>

                <button
                    id="shareScreenBtn"
                    class="tool-btn px-3 py-2 rounded-lg">

                    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
                    Share

                </button>

                <button
                    id="saveBtn"
                    class="tool-btn px-3 py-2 rounded-lg">

                    <svg class="icon" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 4v5h7V4"/><path d="M7 21v-7h10v7"/></svg>
                    Save

                </button>

                <button
                    id="downloadBtn"
                    class="tool-btn px-3 py-2 rounded-lg">

                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
                    Download

                </button>

                <button
                    id="copyRoomCode"
                    class="tool-btn px-3 py-2 rounded-lg">

                    <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                    Copy Code

                </button>

                <button
                    id="exitBtn"
                    class="tool-btn px-3 py-2 rounded-lg">

                    <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                    Exit

                </button>

            </div>

        </div>

        <div
            id="meetingArea"
            class="hidden border-b p-3 flex-shrink-0">

            <div class="flex gap-4 overflow-x-auto">

                <div class="flex flex-col items-center">

                    <video

                        id="localVideo"

                        autoplay

                        muted

                        playsinline

                        class="w-72 h-44">

                    </video>

                    <span class="mt-2">

                        You

                    </span>

                </div>

                <div

                    id="remoteVideos"

                    class="flex gap-4">

                </div>

            </div>

        </div>

        <div

            id="screenShareContainer"

            class="hidden bg-black border-b flex-shrink-0">

            <video

                id="screenVideo"

                autoplay

                playsinline

                muted

                class="w-full h-64">

            </video>

        </div>

        <div id="editorTerminalSplit" class="flex-1 flex flex-col overflow-hidden">

            <div id="editorPane" class="relative flex-1">

                <div
                    id="editor"
                    class="absolute inset-0">
                </div>

                <div
                    id="remoteVideos"
                    class="absolute top-3 right-3 flex flex-col gap-2 z-50">
                </div>

            </div>

            <div id="resizeTerminal" class="resize-y" title="Drag to resize"></div>

            <div
                class="terminal-wrap border-t">

                <div
                    class="terminal-head flex justify-between items-center p-2 px-3">

                    <span class="flex items-center gap-2">
                        <span class="dot" style="background:var(--danger);"></span>
                        <span class="dot" style="background:var(--amber);"></span>
                        <span class="dot" style="background:var(--success);"></span>
                        <span class="font-mono font-semibold ml-2" style="color:var(--text-muted); font-size:.76rem;">Terminal</span>
                    </span>

                    <button

                        id="runBtn"

                        class="px-4 py-1.5 rounded-md">

                        <svg class="icon-solid" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>
                        Run

                    </button>

                </div>

                <pre

                    id="terminalOutput"

                    class="flex-1 overflow-auto p-3">Ready...</pre>

            </div>

        </div>

    </main>

    <div id="resizeSidebarRight" class="resize-x" title="Drag to resize"></div>

    <aside
        class="sidebar-right border-l flex flex-col">

        <div
            class="p-4 border-b" style="border-color:var(--border);">

            <h2
                class="panel-head mb-3">

                <svg class="icon" viewBox="0 0 24 24"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="3.5"/><path d="M21 20v-2a4 4 0 0 0-3-3.87"/><path d="M16.5 3.6a3.5 3.5 0 0 1 0 6.8"/></svg>
                Online Users

            </h2>

            <div
                id="onlineUsers">

            </div>

        </div>

        <div
            id="chatPanel"
            class="flex flex-col flex-1 min-h-0">

            <div class="border-b flex-shrink-0" style="border-color:var(--border);">

                <div class="flex">

                    <button
                        id="chatTab"
                        class="flex-1 p-3 bg-slate-700">

                        <svg class="icon" style="width:15px;height:15px;" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>

<script>
  // Force the Monaco code editor to use its dark theme, regardless of
  // whatever theme room.js passes when it creates the editor instance.
  (function(){
    function applyDarkTheme(){
      if (window.monaco && window.monaco.editor) {
        monaco.editor.setTheme('vs-dark');
      }
    }
    if (window.require) {
      require(['vs/editor/editor.main'], function () {
        applyDarkTheme();
        // Catch any editor instances created after this point too
        // (e.g. if room.js creates the editor asynchronously).
        monaco.editor.onDidCreateEditor(applyDarkTheme);
      });
    }
  })();
</script>

<script>
(function(){
  function makeResizable(handle, target, axis, min, max, reverse){
    if(!handle || !target) return;
    var startPos, startSize;

    function onMove(e){
      var pos = axis === 'x' ? e.clientX : e.clientY;
      var delta = pos - startPos;
      if(reverse) delta = -delta;
      var newSize = startSize + delta;
      newSize = Math.max(min, Math.min(max, newSize));
      if(axis === 'x'){
        target.style.width = newSize + 'px';
      } else {
        target.style.height = newSize + 'px';
      }
      
      window.dispatchEvent(new Event('resize'));
    }

    function onUp(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.body.classList.remove('resizing-x', 'resizing-y');
      handle.classList.remove('is-active');
    }

    handle.addEventListener('pointerdown', function(e){
      startPos = axis === 'x' ? e.clientX : e.clientY;
      var rect = target.getBoundingClientRect();
      startSize = axis === 'x' ? rect.width : rect.height;
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.body.classList.add(axis === 'x' ? 'resizing-x' : 'resizing-y');
      handle.classList.add('is-active');
      e.preventDefault();
    });
  }

  var explorer = document.querySelector('aside.explorer');
  var sidebarRight = document.querySelector('aside.sidebar-right');
  var terminalWrap = document.querySelector('.terminal-wrap');
  var aiControlBlock = document.getElementById('aiControlBlock');

  makeResizable(document.getElementById('resizeExplorer'), explorer, 'x', 180, 480, false);
  makeResizable(document.getElementById('resizeSidebarRight'), sidebarRight, 'x', 240, 560, true);
  makeResizable(document.getElementById('resizeTerminal'), terminalWrap, 'y', 80, 600, true);

  // Resize top AI Controls block
  makeResizable(document.getElementById('resizeAiControls'), aiControlBlock, 'y', 100, 550, false);

  // Resize internal elements of the AI Panel vertically
  var aiResizers = document.querySelectorAll('.ai-card-resizer');
  aiResizers.forEach(function(resizer){
    var targetCard = resizer.previousElementSibling;
    makeResizable(resizer, targetCard, 'y', 70, 500, false);
  });
})();
</script>
